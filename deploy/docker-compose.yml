# docker compose -f deploy/docker-compose.yml up --build   (z koreňa repa)
services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../backend/.env        # kľúče a heslá len tu, nikdy v obraze
    volumes: [ "nacenime-var:/app/var" ]
    restart: unless-stopped
  web:
    image: nginx:1.27-alpine
    ports: [ "8080:80" ]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../design_handoff_nacenime:/var/www/frontend:ro
    depends_on: [ app ]
    restart: unless-stopped
volumes:
  nacenime-var:
