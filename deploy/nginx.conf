# Vzorový server blok. Frontend (statické súbory) servíruj z vlastného koreňa, API ide na php-fpm.
server {
    listen 80;
    server_name nacenime.sk;

    root /var/www/frontend;          # zmrazený frontend, upraviť podľa nasadenia
    index index.html;

    # Len API ide do PHP. Do verejného priečinka sa nikdy nedáva .env, var/ ani vendor/.
    location /api/ {
        client_max_body_size 64k;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 10s;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|sqlite|json|lock)$ { deny all; }
}
