<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa: ukážka</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #f6f4ef; color: #11122f; font: 400 18px/1.5 system-ui, sans-serif; }
  main { max-width: 1060px; margin: 0 auto; padding: 32px clamp(20px, 5vw, 64px); }
  h1 { color: #272361; font-size: clamp(32px, 5vw, 44px); line-height: 1.05; letter-spacing: -0.02em; font-weight: 800; margin: 24px 0 16px; max-width: 16ch; }
  #sur { margin: 16px 0 0; }
</style>
</head>
<body>
<main>
  <p>Ukážka modulu mapy (nie je to obrazovka z prototypu).</p>
  <div id="mapa"></div>
  <h1>Bystrická cesta 12, 034 01 Ružomberok</h1>
  <p id="sur" aria-live="polite">Súradnice: zatiaľ nezmenené</p>
</main>
<script type="module">
  import { vytvorMapu } from './mapa.js';
  const q = new URLSearchParams(location.search);
  const lat = Number(q.get('lat') ?? 49.0816), lng = Number(q.get('lng') ?? 19.3048);
  const sur = document.getElementById('sur');
  window.__vysledok = vytvorMapu(document.getElementById('mapa'), {
    lat, lng,
    naZmenu: (p) => { window.__zmeny = [...(window.__zmeny ?? []), p]; sur.textContent = `Súradnice: ${p.lat}, ${p.lng}`; },
    naChybu: () => { sur.textContent = 'Mapa sa nenačítala, adresa funguje ďalej.'; },
  }).then((m) => (window.__mapa = m));
</script>
</body>
</html>
